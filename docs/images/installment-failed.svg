<svg xmlns="http://www.w3.org/2000/svg" width="960" height="692" viewBox="0 0 960 692" role="img" aria-labelledby="title desc">
<title id="title">When an installment charge fails</title>
<desc id="desc">Decision flow CiviCRM follows for invoice.scheduled_charge_failed.</desc>
<defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.92em; }
.t { font-size: 22px; font-weight: 600; }
.st { font-size: 14px; fill: #59636e; }
.h { font-size: 14.5px; font-weight: 600; }
.b { font-size: 13.5px; }
.s { font-size: 12.5px; fill: #59636e; }
.e { font-size: 13.5px; font-weight: 600; }
.lane { font-size: 15px; font-weight: 600; fill: #ffffff; }
.lanesub { font-size: 12.5px; fill: #ffffff; fill-opacity: .85; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
.sec { font-size: 16px; font-weight: 600; }
.tag { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#424a53"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="691" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<text x="32.0" y="48.0" class="t" text-anchor="start">When an installment charge fails</text>
<text x="32.0" y="74.0" class="st" text-anchor="start">Square retries failed charges and may deliver the failure after a later success, so Square's current invoice status decides.</text>
<rect x="32" y="115.0" width="540" height="43.0" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.25"/>
<text x="44.0" y="139.1" class="e" text-anchor="start" style="fill:#a40e26"><tspan class="m">invoice.scheduled_charge_failed</tspan></text>
<path d="M302.0,158.0 L302.0,189.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="32" y="192.0" width="540" height="68.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="44.0" y="216.1" class="h" text-anchor="start" style="fill:#1f2328">Find the recurring contribution</text>
<text x="44.0" y="241.3" class="b" text-anchor="start" style="fill:#1f2328">By the invoice's subscription, linking it as for a paid installment.</text>
<path d="M302.0,260.0 L302.0,291.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="32" y="294.0" width="540" height="66.0" rx="8" fill="#ffffff" stroke="#424a53" stroke-width="1.5"/>
<text x="44.0" y="318.1" class="h" text-anchor="start" style="fill:#1f2328">Does Square report the invoice paid now?</text>
<text x="44.0" y="341.8" class="s" text-anchor="start" style="fill:#59636e">CiviCRM asks Square for the invoice's current status.</text>
<rect x="616" y="293.0" width="312" height="68.0" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.25"/>
<text x="628.0" y="317.1" class="h" text-anchor="start" style="fill:#116329">Ignore the failure</text>
<text x="628.0" y="342.3" class="b" text-anchor="start" style="fill:#1f2328">The paid events record the installment.</text>
<path d="M572.0,327.0 L613.0,327.0" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#a-ok)"/>
<text x="594.0" y="320.0" class="tag halo" text-anchor="middle">yes</text>
<path d="M302.0,360.0 L302.0,391.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="310.0" y="381.0" class="tag halo" text-anchor="start">no</text>
<rect x="32" y="394.0" width="540" height="43.0" rx="8" fill="#ffffff" stroke="#424a53" stroke-width="1.5"/>
<text x="44.0" y="418.1" class="h" text-anchor="start" style="fill:#1f2328">Which installment failed?</text>
<path d="M302.0,437 L302.0,455" fill="none" stroke="#424a53" stroke-width="1.5"/>
<path d="M176.0,455 L784.0,455" fill="none" stroke="#424a53" stroke-width="1.5"/>
<path d="M176.0,455.0 L176.0,474.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="32.0" y="477.0" width="288.0" height="127.0" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.25"/>
<text x="44.0" y="501.1" class="h" text-anchor="start" style="fill:#a40e26">Its contribution already exists</text>
<text x="44.0" y="524.8" class="s" text-anchor="start" style="fill:#59636e">A contribution already carries this Square</text>
<text x="44.0" y="540.8" class="s" text-anchor="start" style="fill:#59636e">invoice ID.</text>
<text x="44.0" y="565.3" class="b" text-anchor="start" style="fill:#1f2328">Pending becomes Failed.</text>
<path d="M480.0,455.0 L480.0,474.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="336.0" y="477.0" width="288.0" height="127.0" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.25"/>
<text x="348.0" y="501.1" class="h" text-anchor="start" style="fill:#7d4e00">The first installment</text>
<text x="348.0" y="524.8" class="s" text-anchor="start" style="fill:#59636e">Nothing in the series is paid yet.</text>
<text x="348.0" y="549.3" class="b" text-anchor="start" style="fill:#1f2328">The checkout's contribution stays</text>
<text x="348.0" y="567.3" class="b" text-anchor="start" style="fill:#1f2328">Pending. Square keeps the invoice open</text>
<text x="348.0" y="585.3" class="b" text-anchor="start" style="fill:#1f2328">for the donor to pay.</text>
<path d="M784.0,455.0 L784.0,474.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="640.0" y="477.0" width="288.0" height="127.0" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.25"/>
<text x="652.0" y="501.1" class="h" text-anchor="start" style="fill:#a40e26">A later installment</text>
<text x="652.0" y="524.8" class="s" text-anchor="start" style="fill:#59636e">No contribution has this invoice yet.</text>
<text x="652.0" y="549.3" class="b" text-anchor="start" style="fill:#1f2328">A new Failed contribution, copied with</text>
<text x="652.0" y="567.3" class="b" text-anchor="start" style="fill:#1f2328"><tspan class="m">Contribution.repeattransaction</tspan>,</text>
<text x="652.0" y="585.3" class="b" text-anchor="start" style="fill:#1f2328">carrying the Square invoice ID.</text>
<rect x="32" y="626.0" width="896" height="42.0" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.25"/>
<text x="44.0" y="649.3" class="b" text-anchor="start" style="fill:#1f2328">If Square collects the invoice later, <tspan class="m">invoice.payment_made</tspan> reopens the Failed contribution and completes it.</text>
</svg>
