<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1126" viewBox="0 0 960 1126" role="img" aria-labelledby="title desc">
<title id="title">Recurring contribution signup</title>
<desc id="desc">Sequence of setting up a Square subscription for a CiviCRM recurring contribution.</desc>
<defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.92em; }
.t { font-size: 22px; font-weight: 600; }
.st { font-size: 14px; fill: #59636e; }
.h { font-size: 14.5px; font-weight: 600; }
.b { font-size: 13.5px; }
.s { font-size: 12.5px; fill: #59636e; }
.e { font-size: 13.5px; font-weight: 600; }
.lane { font-size: 15px; font-weight: 600; fill: #ffffff; }
.lanesub { font-size: 12.5px; fill: #ffffff; fill-opacity: .85; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
.sec { font-size: 16px; font-weight: 600; }
.tag { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#424a53"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="1125" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<line x1="150" y1="186" x2="150" y2="948" stroke="#afb8c1" stroke-width="1.25" stroke-dasharray="4 4"/>
<line x1="440" y1="186" x2="440" y2="948" stroke="#afb8c1" stroke-width="1.25" stroke-dasharray="4 4"/>
<line x1="800" y1="186" x2="800" y2="948" stroke="#afb8c1" stroke-width="1.25" stroke-dasharray="4 4"/>
<text x="32.0" y="48.0" class="t" text-anchor="start">Recurring contribution signup</text>
<text x="32.0" y="74.0" class="st" text-anchor="start">CiviCRM saves the card and creates a Square subscription. Square then charges every installment itself, including the first, and reports</text>
<text x="32.0" y="93.0" class="st" text-anchor="start">each one by webhook.</text>
<rect x="35.0" y="132" width="230" height="54" rx="8" fill="#0969da"/>
<text x="150.0" y="155.0" class="lane" text-anchor="middle">Donor's browser</text>
<text x="150.0" y="174.0" class="lanesub" text-anchor="middle">js/square.js</text>
<rect x="325.0" y="132" width="230" height="54" rx="8" fill="#8250df"/>
<text x="440.0" y="155.0" class="lane" text-anchor="middle">CiviCRM</text>
<text x="440.0" y="174.0" class="lanesub" text-anchor="middle">Square payment processor</text>
<rect x="685.0" y="132" width="230" height="54" rx="8" fill="#1f2328"/>
<text x="800.0" y="155.0" class="lane" text-anchor="middle">Square</text>
<text x="800.0" y="174.0" class="lanesub" text-anchor="middle">Square APIs</text>
<text x="475.0" y="221.5" class="b halo" text-anchor="middle"><tspan class="m">card.tokenize()</tspan> with buyer verification</text>
<path d="M150.0,234.0 L797.0,234.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="475.0" y="252.0" class="s halo" text-anchor="middle">intent STORE: the card is saved for later charges, so no amount is sent</text>
<text x="475.0" y="291.5" class="b halo" text-anchor="middle">Single-use card token</text>
<path d="M800.0,304.0 L153.0,304.0" fill="none" stroke="#424a53" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-arrow)"/>
<text x="295.0" y="343.5" class="b halo" text-anchor="middle">Submit the form</text>
<path d="M150.0,356.0 L437.0,356.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="305.0" y="372.0" width="270" height="78.0" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.25"/>
<text x="317.0" y="395.3" class="b" text-anchor="start" style="fill:#1f2328">The checkout saves a Pending</text>
<text x="317.0" y="413.3" class="b" text-anchor="start" style="fill:#1f2328">contribution and a Pending recurring</text>
<text x="317.0" y="431.3" class="b" text-anchor="start" style="fill:#1f2328">contribution.</text>
<text x="620.0" y="481.5" class="b halo" text-anchor="middle">Create the plan variation, once</text>
<path d="M440.0,494.0 L797.0,494.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="620.0" y="512.0" class="s halo" text-anchor="middle"><tspan class="m">BatchUpsertCatalogObjects</tspan> for this amount and</text>
<text x="620.0" y="528.0" class="s halo" text-anchor="middle">cadence, e.g. MONTHLY 25.00 USD; reused from</text>
<text x="620.0" y="544.0" class="s halo" text-anchor="middle">square_catalog_map after that</text>
<text x="620.0" y="583.5" class="b halo" text-anchor="middle">Find or create the Square customer</text>
<path d="M440.0,596.0 L797.0,596.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="620.0" y="614.0" class="s halo" text-anchor="middle">the mapped customer, else one with this contact's</text>
<text x="620.0" y="630.0" class="s halo" text-anchor="middle">reference_id and email, else a new one</text>
<text x="620.0" y="669.5" class="b halo" text-anchor="middle"><tspan class="m">CreateCard</tspan></text>
<path d="M440.0,682.0 L797.0,682.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="620.0" y="700.0" class="s halo" text-anchor="middle">token and billing address; the card ID is saved as the</text>
<text x="620.0" y="716.0" class="s halo" text-anchor="middle">recurring contribution's payment token</text>
<text x="620.0" y="755.5" class="b halo" text-anchor="middle"><tspan class="m">CreateSubscription</tspan></text>
<path d="M440.0,768.0 L797.0,768.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="620.0" y="786.0" class="s halo" text-anchor="middle">plan variation, customer and card; starts today;</text>
<text x="620.0" y="802.0" class="s halo" text-anchor="middle">source.name holds the contact and recurring IDs</text>
<text x="620.0" y="841.5" class="b halo" text-anchor="middle">Subscription ID</text>
<path d="M800.0,854.0 L443.0,854.0" fill="none" stroke="#424a53" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a-arrow)"/>
<rect x="305.0" y="870.0" width="270" height="78.0" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.25"/>
<text x="317.0" y="893.3" class="b" text-anchor="start" style="fill:#1f2328">Saved on the recurring contribution.</text>
<text x="317.0" y="911.3" class="b" text-anchor="start" style="fill:#1f2328">The contribution and the recurring</text>
<text x="317.0" y="929.3" class="b" text-anchor="start" style="fill:#1f2328">contribution stay Pending.</text>
<rect x="675.0" y="870.0" width="250" height="78.0" rx="8" fill="#1f2328" stroke="#1f2328" stroke-width="1.25"/>
<text x="687.0" y="893.3" class="b" text-anchor="start" style="fill:#ffffff">Square bills the first invoice within</text>
<text x="687.0" y="911.3" class="b" text-anchor="start" style="fill:#ffffff">seconds. Its webhooks complete</text>
<text x="687.0" y="929.3" class="b" text-anchor="start" style="fill:#ffffff">the Pending contribution.</text>
<text x="32" y="986" class="sec">If something goes wrong</text>
<rect x="32" y="1000.0" width="896" height="102.0" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="59.0" y="1023.3" class="b" text-anchor="start" style="fill:#1f2328">A cadence Square cannot bill (e.g. every 3 weeks) is refused before any card is saved.</text>
<text x="46" y="1023.3" class="b" style="fill:#1f2328">•</text>
<text x="59.0" y="1044.3" class="b" text-anchor="start" style="fill:#1f2328">A card declined at <tspan class="m">CreateCard</tspan>: nothing is charged. The contribution is marked Failed and the recurring contribution deleted.</text>
<text x="46" y="1044.3" class="b" style="fill:#1f2328">•</text>
<text x="59.0" y="1065.3" class="b" text-anchor="start" style="fill:#1f2328">No answer from <tspan class="m">CreateSubscription</tspan>: Square may still bill. The first webhook links the subscription to its recurring contribution using</text>
<text x="59.0" y="1083.3" class="b" text-anchor="start" style="fill:#1f2328">source.name, after checking the contact and Square customer.</text>
<text x="46" y="1065.3" class="b" style="fill:#1f2328">•</text>
</svg>
