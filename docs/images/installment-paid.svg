<svg xmlns="http://www.w3.org/2000/svg" width="960" height="914" viewBox="0 0 960 914" role="img" aria-labelledby="title desc">
<title id="title">Recording a paid installment</title>
<desc id="desc">Decision flow CiviCRM follows when Square reports a paid subscription installment.</desc>
<defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
.m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.92em; }
.t { font-size: 22px; font-weight: 600; }
.st { font-size: 14px; fill: #59636e; }
.h { font-size: 14.5px; font-weight: 600; }
.b { font-size: 13.5px; }
.s { font-size: 12.5px; fill: #59636e; }
.e { font-size: 13.5px; font-weight: 600; }
.lane { font-size: 15px; font-weight: 600; fill: #ffffff; }
.lanesub { font-size: 12.5px; fill: #ffffff; fill-opacity: .85; }
.halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
.sec { font-size: 16px; font-weight: 600; }
.tag { font-size: 12px; font-weight: 600; fill: #59636e; }
</style><marker id="a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#424a53"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker><marker id="a-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="913" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<text x="32.0" y="48.0" class="t" text-anchor="start">Recording a paid installment</text>
<text x="32.0" y="74.0" class="st" text-anchor="start">Runs for whichever paid event arrives first. Installments of one recurring contribution are recorded one at a time.</text>
<rect x="32" y="115.0" width="540" height="43.0" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.25"/>
<text x="44.0" y="139.1" class="e" text-anchor="start" style="fill:#0550ae"><tspan class="m">payment.updated</tspan> (COMPLETED) or <tspan class="m">invoice.payment_made</tspan> (PAID)</text>
<path d="M302.0,158.0 L302.0,189.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="32" y="192.0" width="540" height="104.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="44.0" y="216.1" class="h" text-anchor="start" style="fill:#1f2328">Find the subscription and the Square payment</text>
<text x="44.0" y="241.3" class="b" text-anchor="start" style="fill:#1f2328">A payment names only its order, so CiviCRM finds its invoice with</text>
<text x="44.0" y="259.3" class="b" text-anchor="start" style="fill:#1f2328"><tspan class="m">SearchInvoices</tspan>. An invoice does not name its payment, so CiviCRM reads it from</text>
<text x="44.0" y="277.3" class="b" text-anchor="start" style="fill:#1f2328">the invoice's order with <tspan class="m">GetOrder</tspan>.</text>
<path d="M302.0,296.0 L302.0,327.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="32" y="330.0" width="540" height="43.0" rx="8" fill="#ffffff" stroke="#424a53" stroke-width="1.5"/>
<text x="44.0" y="354.1" class="h" text-anchor="start" style="fill:#1f2328">Is a recurring contribution linked to this subscription?</text>
<rect x="616" y="272.5" width="312" height="158.0" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.25"/>
<text x="628.0" y="296.6" class="h" text-anchor="start" style="fill:#7d4e00">Not linked yet</text>
<text x="628.0" y="321.8" class="b" text-anchor="start" style="fill:#1f2328">CiviCRM links the recurring contribution</text>
<text x="628.0" y="339.8" class="b" text-anchor="start" style="fill:#1f2328">named in the subscription's source.name if its</text>
<text x="628.0" y="357.8" class="b" text-anchor="start" style="fill:#1f2328">contact and Square customer match, then</text>
<text x="628.0" y="375.8" class="b" text-anchor="start" style="fill:#1f2328">carries on. Otherwise it retries for 30 minutes,</text>
<text x="628.0" y="393.8" class="b" text-anchor="start" style="fill:#1f2328">then ignores the event: the subscription is not</text>
<text x="628.0" y="411.8" class="b" text-anchor="start" style="fill:#1f2328">CiviCRM's.</text>
<path d="M572.0,351.5 L613.0,351.5" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#a-wait)"/>
<text x="594.0" y="344.5" class="tag halo" text-anchor="middle">no</text>
<path d="M302.0,373.0 L302.0,441.5" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="310.0" y="394.0" class="tag halo" text-anchor="start">yes</text>
<rect x="32" y="444.5" width="540" height="43.0" rx="8" fill="#ffffff" stroke="#424a53" stroke-width="1.5"/>
<text x="44.0" y="468.6" class="h" text-anchor="start" style="fill:#1f2328">Is this Square payment already recorded?</text>
<rect x="616" y="444.5" width="312" height="104.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="628.0" y="468.6" class="h" text-anchor="start" style="fill:#1f2328">Stop</text>
<text x="628.0" y="493.8" class="b" text-anchor="start" style="fill:#1f2328">The Square payment ID is the key, so a</text>
<text x="628.0" y="511.8" class="b" text-anchor="start" style="fill:#1f2328">replayed event, or the second of the two paid</text>
<text x="628.0" y="529.8" class="b" text-anchor="start" style="fill:#1f2328">events, changes nothing.</text>
<path d="M572.0,466.0 L613.0,466.0" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="594.0" y="459.0" class="tag halo" text-anchor="middle">yes</text>
<path d="M302.0,487.5 L302.0,518.5" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="310.0" y="508.5" class="tag halo" text-anchor="start">no</text>
<rect x="32" y="521.5" width="540" height="128.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="44.0" y="545.6" class="h" text-anchor="start" style="fill:#1f2328">Choose the contribution</text>
<text x="59.0" y="570.8" class="b" text-anchor="start" style="fill:#1f2328">First installment: the Pending contribution the checkout created.</text>
<text x="46" y="570.8" class="b" style="fill:#1f2328">•</text>
<text x="59.0" y="591.8" class="b" text-anchor="start" style="fill:#1f2328">An invoice that failed earlier: reopen its Failed contribution.</text>
<text x="46" y="591.8" class="b" style="fill:#1f2328">•</text>
<text x="59.0" y="612.8" class="b" text-anchor="start" style="fill:#1f2328">Any later installment: a new Pending contribution, copied with</text>
<text x="59.0" y="630.8" class="b" text-anchor="start" style="fill:#1f2328"><tspan class="m">Contribution.repeattransaction</tspan>.</text>
<text x="46" y="612.8" class="b" style="fill:#1f2328">•</text>
<path d="M302.0,649.5 L302.0,680.5" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<rect x="32" y="683.5" width="540" height="43.0" rx="8" fill="#ffffff" stroke="#424a53" stroke-width="1.5"/>
<text x="44.0" y="707.6" class="h" text-anchor="start" style="fill:#1f2328">Do the amount and currency match CiviCRM's?</text>
<rect x="616" y="653.0" width="312" height="104.0" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.25"/>
<text x="628.0" y="677.1" class="h" text-anchor="start" style="fill:#a40e26">Nothing is recorded</text>
<text x="628.0" y="702.3" class="b" text-anchor="start" style="fill:#1f2328">The webhook record is marked error for</text>
<text x="628.0" y="720.3" class="b" text-anchor="start" style="fill:#1f2328">manual reconciliation. CiviCRM's amounts are</text>
<text x="628.0" y="738.3" class="b" text-anchor="start" style="fill:#1f2328">never changed to match Square.</text>
<path d="M572.0,705.0 L613.0,705.0" fill="none" stroke="#cf222e" stroke-width="1.5" marker-end="url(#a-bad)"/>
<text x="594.0" y="698.0" class="tag halo" text-anchor="middle">no</text>
<path d="M302.0,726.5 L302.0,757.5" fill="none" stroke="#424a53" stroke-width="1.5" marker-end="url(#a-arrow)"/>
<text x="310.0" y="747.5" class="tag halo" text-anchor="start">yes</text>
<rect x="32" y="760.5" width="540" height="128.0" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.25"/>
<text x="44.0" y="784.6" class="h" text-anchor="start" style="fill:#116329"><tspan class="m">Payment.create</tspan> completes the contribution</text>
<text x="59.0" y="809.8" class="b" text-anchor="start" style="fill:#1f2328">Its transaction ID becomes the Square payment ID.</text>
<text x="46" y="809.8" class="b" style="fill:#1f2328">•</text>
<text x="59.0" y="830.8" class="b" text-anchor="start" style="fill:#1f2328">The first payment moves the recurring contribution from Pending to In Progress.</text>
<text x="46" y="830.8" class="b" style="fill:#1f2328">•</text>
<text x="59.0" y="851.8" class="b" text-anchor="start" style="fill:#1f2328">Only the first installment is receipted, once, as the recurring contribution's</text>
<text x="59.0" y="869.8" class="b" text-anchor="start" style="fill:#1f2328">receipt setting says. Later installments are not receipted.</text>
<text x="46" y="851.8" class="b" style="fill:#1f2328">•</text>
</svg>
